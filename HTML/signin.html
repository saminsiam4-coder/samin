<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signin-container {
            background: white;
            max-width: 350px;
            width: 100%;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 32px;
            color: #000;
        }

        .logo .smile {
            color: #FF9900;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #e77600;
            box-shadow: 0 0 3px 2px rgba(228,121,17,0.5);
        }

        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(to bottom,#f7dfa5,#f0c14b);
            border: 1px solid #a88734;
            padding: 10px;
            border-radius: 3px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: linear-gradient(to bottom,#f5d78e,#edb933);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #767676;
            font-size: 13px;
        }

        .signup-link {
            text-align: center;
            font-size: 13px;
        }

        .signup-link a {
            color: #0066c0;
            text-decoration: none;
        }

        .signup-link a:hover {
            color: #c45500;
            text-decoration: underline;
        }

        .loading {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="signin-container">
        <div class="logo">
            <h1>amazon<span class="smile">⌣</span></h1>
        </div>

        <h2>Sign in</h2>

        <div id="alertMessage" class="alert"></div>

        <form id="signinForm">
            <div class="form-group">
                <label for="email">Email or mobile phone number</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <div class="btn-content">
                    <span class="loading" id="loadingSpinner"></span>
                    <span id="btnText">Sign in</span>
                </div>
            </button>
        </form>

        <div class="divider">────────────────</div>

        <div class="signup-link">
            New to Amazon? <a href="signup.html">Create your Amazon account</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('signinForm');
        const alertDiv = document.getElementById('alertMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // Check if already signed in
        document.addEventListener('DOMContentLoaded', function() {
            const userId = localStorage.getItem('user_id');
            if (userId) {
                console.log('Already signed in, redirecting...');
                window.location.href = 'index.html';
            }
        });

        // Show alert message
        function showAlert(message, type) {
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type} show`;
        }

        // Hide alert
        function hideAlert() {
            alertDiv.classList.remove('show');
        }

        // Set loading state
        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                loadingSpinner.style.display = 'block';
                btnText.textContent = 'Signing in...';
            } else {
                submitBtn.disabled = false;
                loadingSpinner.style.display = 'none';
                btnText.textContent = 'Sign in';
            }
        }

        // Form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validation
            if (!email) {
                showAlert('Please enter your email', 'error');
                return;
            }

            if (!password) {
                showAlert('Please enter your password', 'error');
                return;
            }

            console.log('📤 Attempting signin for:', email);

            setLoading(true);

            try {
                const response = await fetch('http://localhost:5500/api/auth/signin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();
                console.log('📥 Server response:', result);

                if (!response.ok) {
                    throw new Error(result.error || 'Signin failed');
                }

                // ✅ SUCCESS! Store ALL user data in localStorage
                console.log('✅ Sign in successful! Storing user data...');
                
                // Store user ID (CRITICAL for cart and profile)
                localStorage.setItem('user_id', result.user_id);
                
                // Store user name for display
                localStorage.setItem('first_name', result.first_name);
                
                // Store full user object
                localStorage.setItem('currentUser', JSON.stringify({
                    user_id: result.user_id,
                    first_name: result.first_name,
                    last_name: result.last_name,
                    email: result.email
                }));
                
                // Store token if needed
                if (result.token) {
                    localStorage.setItem('token', result.token);
                }

                // Verify storage
                console.log('📦 Stored in localStorage:', {
                    user_id: localStorage.getItem('user_id'),
                    first_name: localStorage.getItem('first_name'),
                    currentUser: localStorage.getItem('currentUser')
                });

                // Show success message
                showAlert('✓ Sign in successful! Redirecting...', 'success');

                // Redirect to homepage after 1 second
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('❌ Signin error:', error);
                showAlert('⚠ ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
