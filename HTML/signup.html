<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Create Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-container {
            background: white;
            max-width: 400px;
            width: 100%;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 32px;
            color: #000;
        }

        .logo .smile {
            color: #FF9900;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            font-size: 14px;
            transition: border 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #e77600;
            box-shadow: 0 0 3px 2px rgba(228,121,17,0.5);
        }

        .name-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .error-message {
            background-color: #fff5f5;
            border: 1px solid #d32f2f;
            color: #d32f2f;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background-color: #f0f9ff;
            border: 1px solid #007185;
            color: #007185;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-hint {
            font-size: 12px;
            color: #565959;
            margin-top: 5px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(to bottom,#f7dfa5,#f0c14b);
            border: 1px solid #a88734;
            padding: 10px;
            border-radius: 3px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: linear-gradient(to bottom,#f5d78e,#edb933);
        }

        .submit-btn:active {
            background: #f0c14b;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .terms {
            font-size: 11px;
            color: #565959;
            margin-top: 15px;
            line-height: 1.5;
        }

        .terms a {
            color: #0066c0;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #767676;
            font-size: 13px;
        }

        .signin-link {
            text-align: center;
            font-size: 13px;
        }

        .signin-link a {
            color: #0066c0;
            text-decoration: none;
        }

        .signin-link a:hover {
            color: #c45500;
            text-decoration: underline;
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <h1>amazon<span class="smile">⌣</span></h1>
        </div>

        <h2>Create account</h2>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="signupForm">
            <div class="name-group">
                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Mobile number or email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone number (optional)</label>
                <input type="tel" id="phone" name="phone" placeholder="+880 1XXX-XXXXXX">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
                <p class="password-hint">ⓘ Passwords must be at least 6 characters.</p>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Re-enter password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="loading" id="loadingSpinner"></span>
                <span id="btnText">Continue</span>
            </button>

            <p class="terms">
                By creating an account, you agree to Amazon's 
                <a href="#">Conditions of Use</a> and 
                <a href="#">Privacy Notice</a>.
            </p>
        </form>

        <div class="divider">────────────────</div>

        <div class="signin-link">
            Already have an account? <a href="signin.html">Sign-In ›</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // Show error message
        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
            successMsg.classList.remove('show');
        }

        // Show success message
        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.classList.add('show');
            errorMsg.classList.remove('show');
        }

        // Hide all messages
        function hideMessages() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }

        // Set loading state
        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                loadingSpinner.classList.add('show');
                btnText.textContent = 'Creating account...';
            } else {
                submitBtn.disabled = false;
                loadingSpinner.classList.remove('show');
                btnText.textContent = 'Continue';
            }
        }

        // Form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideMessages();

            // Get form values
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (!firstName) {
                showError('Please enter your first name.');
                return;
            }

            if (!lastName) {
                showError('Please enter your last name.');
                return;
            }

            if (!email) {
                showError('Please enter your email or mobile number.');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters long.');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match. Please try again.');
                return;
            }

            // Prepare data for API
            const userData = {
                first_name: firstName,
                last_name: lastName,
                email: email,
                password: password,
                phone: phone || null
            };

            console.log('📤 Sending signup data:', userData);

            setLoading(true);

            try {
                // Call backend API
                const response = await fetch('http://localhost:3000/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });

                const result = await response.json();
                console.log('📥 Server response:', result);

                if (!response.ok) {
                    throw new Error(result.error || 'Signup failed');
                }

                // Success!
                showSuccess('✓ Account created successfully! Redirecting to sign in...');
                
                // Clear form
                form.reset();

                // Redirect to signin page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'signin.html';
                }, 2000);

            } catch (error) {
                console.error('❌ Signup error:', error);
                showError('⚠ ' + error.message);
            } finally {
                setLoading(false);
            }
        });

        // Real-time password match validation
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;

            if (confirmPassword && password !== confirmPassword) {
                this.style.borderColor = '#d32f2f';
            } else {
                this.style.borderColor = '#a6a6a6';
            }
        });
    </script>
</body>
</html>
