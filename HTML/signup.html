<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .logo {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: bold;
            color: #000;
            text-decoration: none;
            position: relative;
        }

        .logo-text::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 40%;
            height: 3px;
            background-color: #ff9900;
            border-radius: 2px;
        }

        .signup-container {
            width: 100%;
            max-width: 350px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px 26px;
            background-color: #fff;
        }

        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 20px;
            color: #111;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #111;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 14px;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #e77600;
            box-shadow: 0 0 3px 2px rgba(228, 121, 17, 0.5);
        }

        input::placeholder {
            color: #767676;
        }

        .info-text {
            font-size: 12px;
            color: #0f1111;
            margin-top: -10px;
            margin-bottom: 14px;
            display: flex;
            align-items: flex-start;
        }

        .info-icon {
            color: #007185;
            margin-right: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        /* --- NEW STYLES FOR MESSAGES --- */
        .message-box {
            font-size: 12px;
            margin-bottom: 15px;
            display: none; /* Hidden by default */
            padding: 10px;
            border-radius: 4px;
            line-height: 1.4;
        }

        .error-msg {
            color: #ba0933;
            border: 1px solid #ba0933;
            background-color: #fff4f4;
            display: flex;
            align-items: center;
        }
        
        .success-msg {
            color: #007600;
            border: 1px solid #007600;
            background-color: #f4fff4;
        }

        .error-icon {
            margin-right: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        /* ------------------------------- */

        .signupBtn {
            width: 100%;
            padding: 8px;
            background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
            border: 1px solid #a88734;
            border-radius: 3px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 16px;
            color: #111;
        }

        .signupBtn:hover {
            background: linear-gradient(to bottom, #f5d78e, #edb933);
        }

        .terms {
            font-size: 12px;
            line-height: 1.5;
            color: #111;
            margin-bottom: 20px;
        }

        .terms a {
            color: #0066c0;
            text-decoration: none;
        }

        .terms a:hover {
            color: #c45500;
            text-decoration: underline;
        }

        .divider {
            margin: 20px 0;
            text-align: center;
            position: relative;
            border-top: 1px solid #e7e7e7;
        }

        .signin-link {
            font-size: 13px;
            color: #111;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        .signin-link a {
            color: #0066c0;
            text-decoration: none;
            margin-left: 5px;
        }

        .signin-link a:hover {
            color: #c45500;
            text-decoration: underline;
        }

        .arrow {
            color: #0066c0;
            margin-left: 3px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <a href="#" class="logo-text">amazon</a>
    </div>

    <div class="signup-container">
        <h1>Create account</h1>

        <label for="name">Your name</label>
        <input type="text" id="first_name" placeholder="First and last name">

        <label for="email">Mobile number or email</label>
        <input type="text" id="email">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters">

        <div class="info-text">
            <span class="info-icon">i</span>
            <span>Passwords must be at least 6 characters.</span>
        </div>

        <div id="errorMessage" class="message-box error-msg">
            <span class="error-icon">!</span>
            <span id="errorText">Error message here</span>
        </div>
        <div id="successMessage" class="message-box success-msg">
            Success message here
        </div>

        <button id="signupBtn" class="signupBtn">Continue</button>

        <div class="terms">
            By creating an account, you agree to Amazon's
            <a href="conditionpage.html">Conditions of Use</a> and
            <a href="privacy.html">Privacy Notice</a>.
        </div>

        <div class="divider"></div>

        <div class="signin-link">
            Already have an account?
            <a href="signin.html">Sign-In<span class="arrow">›</span></a>
        </div>
    </div>

<script>
    // IMPORTANT: Check your Backend Port (e.g., 5500 or 3000)
    const API_URL = 'http://localhost:5500'; 

    document.getElementById('signupBtn').addEventListener('click', async () => {
        // Get values
        const name = document.getElementById('first_name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Get message containers
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const successMessage = document.getElementById('successMessage');

        // Helper to show errors
        const showError = (msg) => {
            if (errorMessage && errorText) {
                errorText.textContent = msg;
                errorMessage.style.display = 'flex'; // Use flex to align icon
                successMessage.style.display = 'none';
            } else {
                alert(msg);
            }
        };

        // Helper to show success
        const showSuccess = (msg) => {
            if (successMessage) {
                successMessage.textContent = msg;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
            } else {
                alert(msg);
            }
        };

        // Reset previous messages on click
        if (errorMessage) errorMessage.style.display = 'none';
        if (successMessage) successMessage.style.display = 'none';

        // Validation
        if (!first_name || !email || !password) {
            showError('Enter your name, email, and password');
            return;
        }

        try {
            const response = await fetch(`${API_URL}/api/auth/signup`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                showSuccess('Account created successfully! Redirecting...');
                
                // Redirect to Sign In page after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'signin.html'; 
                }, 1500);
            } else {
                showError(data.error || 'Registration failed');
            }

        } catch (error) {
            console.error('Error:', error);
            showError(`Connection error. Is backend running on port 5500?`);
        }
    });

    // Allow Enter key to submit
    document.getElementById('password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('signupBtn').click();
        }
    });
</script>
</body>
</html>
